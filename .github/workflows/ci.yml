name: Build Web, Deploy Pages & Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-and-android
  cancel-in-progress: false

jobs:
  # ============================================================
  # BUILD WEB ASSETS ONCE - shared by both jobs below, so the
  # Pages site and the APK's bundled web content can never drift
  # out of sync with each other.
  # ============================================================
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Create SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload dist for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  # ============================================================
  # DEPLOY TO GITHUB PAGES
  # ============================================================
  deploy-pages:
    name: Deploy Web App to Pages
    needs: build-web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # BUILD ANDROID APK - reuses the same dist/ built above
  # ============================================================
  build-android:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with run number for easy identification
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Tatvisha-Distribution-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tatvisha-Distribution-Android-APK
          path: android/app/build/outputs/apk/debug/Tatvisha-Distribution-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
