name: Publish Web and Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# GitHub moved Actions from Node 20 to Node 24 in 2026.
# Keep this enabled so older transitive actions don't fall back to Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # npm ci requires every platform-specific optional dependency to be
        # represented in package-lock.json. This project's lockfile was
        # generated without those optional packages, so use npm install to
        # resolve them correctly on the Linux GitHub runner.
        run: npm install --include=optional --no-audit --no-fund

      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy index.html to 404.html for SPA
        run: cp dist/index.html dist/404.html

      # Keep the existing gh-pages deployment.
      # In GitHub Settings > Pages, the source should remain "Deploy from a branch"
      # with the branch set to gh-pages.
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # npm ci requires every platform-specific optional dependency to be
        # represented in package-lock.json. This project's lockfile was
        # generated without those optional packages, so use npm install to
        # resolve them correctly on the Linux GitHub runner.
        run: npm install --include=optional --no-audit --no-fund

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      # Capacitor 8 is configured for Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Show build tool versions
        run: |
          node --version
          npm --version
          java --version

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # This creates a downloadable APK under the workflow run's Artifacts section.
      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: Tatvisha-Distribution-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
